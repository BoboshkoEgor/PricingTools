}

  --mint:#0F2A20; --mint-2:#123528; --card:#16241E; --card-line:#24493A; --ink:#E6F2EC; --ink-2:#AFC2B8; --muted:#8CA095;

  --ok:#5FD39A; --ok-bg:#163A29; --low:#F2B45E; --low-bg:#3A2A12; --neg:#FF8A93; --neg-bg:#3D1A1E; --chip:#1D2E27; color-scheme: dark; } }
:root[data-theme="dark"]{
  --mint:#0F2A20; --mint-2:#123528; --card:#16241E; --card-line:#24493A; --ink:#E6F2EC; --ink-2:#AFC2B8; --muted:#8CA095;
  --red:#FF4D5E; --tool:#0B141A; --tool-ink:#DCE7E1; --tool-line:#24333D;
  --ok:#5FD39A; --ok-bg:#163A29; --low:#F2B45E; --low-bg:#3A2A12; --neg:#FF8A93; --neg-bg:#3D1A1E; --chip:#1D2E27; color-scheme: dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--mint);color:var(--ink);font-family:Manrope, "Segoe UI", Arial, sans-serif;font-size:15px;line-height:1.45}
.flag{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:22px;line-height:1;width:28px;display:inline-flex;justify-content:center}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2E86AB;outline-offset:2px}

/* analyst toolbar */
.tool{position:sticky;top:0;z-index:5;background:var(--tool);color:var(--tool-ink);padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;border-bottom:1px solid var(--tool-line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--tool)}
.tool b{font-weight:700}
.tool .grp{display:flex;align-items:center;gap:8px}
.tool select{background:#22313C;border:1px solid var(--tool-line);color:var(--tool-ink);border-radius:8px;padding:6px 10px}
.tool label.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
.tool .file{border:1px dashed #5D7080;border-radius:8px;padding:6px 12px;cursor:pointer}
.tool .file input{display:none}
.tool .status{color:#9FB2A8;font-size:13px}

/* site */
.site{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:22px}
.brand .name{font-weight:800;font-size:22px;letter-spacing:-0.2px}
.brand .tag{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:12px;justify-content:center;margin-bottom:0}
.tab{border:none;background:var(--card);border-radius:16px 16px 0 0;padding:16px 0;width:min(350px,46%);font-weight:800;font-size:20px;cursor:pointer;color:var(--ink);opacity:.7}
.tab[aria-selected="true"]{background:var(--mint-2);opacity:1}
.panel{background:var(--mint-2);border-radius:20px;padding:28px}
.search{display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.search input{flex:1;min-width:220px;border:1px solid var(--card-line);background:var(--card);border-radius:12px;padding:12px 14px}
.search .sum{color:var(--ink-2);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.grid{grid-template-columns:1fr}.panel{padding:16px}}
.cty{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card-line);border-radius:10px;padding:18px 18px;min-height:92px;text-align:left;cursor:pointer;color:var(--ink)}
.cty:hover{border-color:#62CFA0}
.cty .nm{flex:1;font-weight:700;font-size:16px;line-height:1.2}
.cty .mini{display:block;font-weight:600;font-size:12px;margin-top:5px}
.cty .arr{font-size:18px;color:var(--ink)}

/* country page */
.back{border:none;background:none;color:var(--ink-2);cursor:pointer;padding:6px 0;margin-bottom:6px;font-weight:600}
.ctitle{text-align:center}
.ctitle .lead{font-size:16px;color:var(--ink-2)}
.ctitle h1{margin:6px 0 4px;font-size:30px;font-weight:800;display:flex;gap:10px;justify-content:center;align-items:center;letter-spacing:.3px}
.ctitle h2{margin:6px 0 2px;font-size:22px;font-weight:500}
.ctitle .guar{font-size:12px;color:var(--ink-2)}
.plans{display:flex;gap:12px;justify-content:center;margin:22px 0 10px;flex-wrap:wrap}
.plan{position:relative;width:min(330px,100%);text-align:left;background:var(--card);border:1px solid var(--card-line);border-radius:12px;padding:30px 20px 18px;cursor:pointer;color:var(--ink-2)}
.plan[aria-pressed="true"]{background:#FFFFFF;border:2px solid #2BB98A;color:var(--ink)}
:root[data-theme="dark"] .plan[aria-pressed="true"]{background:#1C3029}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .plan[aria-pressed="true"]{background:#1C3029}}
.plan h3{margin:0 0 8px;font-size:26px;font-weight:800;color:inherit;letter-spacing:.3px}
.plan p{margin:0 0 10px;font-size:13px}
.plan .badge{position:absolute;top:12px;left:18px;background:var(--yellow);color:#15212B;font-size:11px;font-weight:800;border-radius:12px;padding:5px 14px}
.plan .stat{font-weight:700;font-size:13px;color:var(--ink)}
.note{max-width:640px;margin:8px auto 18px;font-size:12px;color:var(--ink-2)}
.unl{background:var(--mint-2);border-radius:14px;padding:12px 18px 18px;margin-bottom:18px}
.unl .lbl{font-size:12px;font-weight:800;margin:2px 0 10px}
.more{text-align:center;font-weight:600;margin:24px 0 16px;color:var(--ink-2);border-top:1px solid var(--card-line);padding-top:22px}
.row{display:grid;grid-template-columns:80px 1.1fr 90px 110px 1.6fr 110px;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card-line);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.row .vol{font-weight:800;font-size:16px}
.row .reg{color:var(--ink)}
.row .days{font-size:12px;color:var(--ink-2)}
.row .price{font-weight:800;font-size:16px;text-align:right;white-space:nowrap}
.row .info{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
.buy{background:var(--red);color:var(--red-ink);border:none;border-radius:6px;padding:10px 0;font-weight:700;cursor:pointer}
@media (max-width:820px){.row{grid-template-columns:60px 1fr 1fr;grid-auto-rows:auto}.row .reg{display:none}.row .info{grid-column:1/-1}.row .buy{grid-column:1/-1}}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;background:var(--chip);color:var(--ink-2)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.low{background:var(--low-bg);color:var(--low)} .chip.neg{background:var(--neg-bg);color:var(--neg)}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tool);color:var(--tool-ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2);margin-top:12px}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

<script>
// row: [region, code, market, regional, vol, validity, bucket, cost, qty, rec, p1, p2, p3, p4, best, median, sku]
let DATA = window.__DATA__;
const I = {region:0, code:1, market:2, regional:3, vol:4, validity:5, bucket:6, cost:7, qty:8, best:14, median:15, sku:16};
const TARGET = b => (b === "1-10GB" ? 0.30 : 0.20);
const REG_RU = {"Europe":"Европа","Asia 26":"Азия 26","Asia":"Азия","Global":"Весь мир","Mini Global":"Мини-глобальный",
  "South America":"Южная Америка","North America":"Северная Америка","Middle East":"Ближний Восток","Africa":"Африка",
  "caribbean-2002":"Карибы","Oceania":"Океания"};
const regionNames = (() => { try { return new Intl.DisplayNames(["ru"], {type: "region"}); } catch (e) { return null; } })();
const fmtEur = v => v == null ? "—" : v.toFixed(2);
const fmtInt = v => v.toLocaleString("ru-RU");
const pct = v => (v * 100).toFixed(0) + "%";

let state = {tab: "local", q: "", priceIdx: 9, plan: "exp", showMargin: true, showComp: false, showQty: false};
let regions = new Map();

function ruName(r) {
  if (r.regional) return REG_RU[r.name] || r.name;
  if (regionNames && /^[A-Z]{2}$/.test(r.code)) {
    try { const n = regionNames.of(r.code); if (n && n !== r.code) return n; } catch (e) {}
  }
  return r.name;
}
function flag(r) {
  if (r.regional) return "🌍";
  if (!/^[A-Z]{2}$/.test(r.code)) return "🏳️";
  return String.fromCodePoint(...[...r.code].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
}
function slug(name) { return "c-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }

function buildRegions() {
  regions = new Map();
  const codeOf = {};
  DATA.forEach(r => { if (r[I.code]) codeOf[r[I.region]] = r[I.code]; });
  DATA.forEach(r => {
    const name = r[I.region];
    if (!regions.has(name)) regions.set(name, {name, code: codeOf[name] || "", regional: !!r[I.regional], market: r[I.market], qty: 0, rows: []});
    const g = regions.get(name);
    g.rows.push(r); g.qty += r[I.qty] || 0;
  });
  regions.forEach(g => { g.ru = ruName(g); g.slug = slug(g.name); });
}

function price(r) { return r[state.priceIdx]; }
function marginOf(rows) {
  let rev = 0, prof = 0;
  rows.forEach(r => { const p = price(r); if (p == null) return; const q = r[I.qty] || 0; rev += q * p; prof += q * (p - r[I.cost]); });
  return rev > 0 ? prof / rev : null;
}
function marginClass(m, bucket) { return m < 0 ? "neg" : (m < TARGET(bucket) - 1e-9 ? "low" : "ok"); }

function marginChip(r) {
  const p = price(r); if (p == null) return "";
  const e = p - r[I.cost], m = e / p;
  return `<span class="chip ${marginClass(m, r[I.bucket])}" title="Маржа: цена минус себестоимость ${fmtEur(r[I.cost])} €; цель для группы — ${pct(TARGET(r[I.bucket]))}">${e >= 0 ? "+" : "−"}${fmtEur(Math.abs(e))} € · ${pct(m)}</span>`;
}
function compChip(r) {
  const b = r[I.best], md = r[I.median], p = price(r);
  if (b == null) return `<span class="chip">нет цен конкурентов</span>`;
  const st = p <= b - 0.01 + 1e-9 ? ["ТОП-1", "ok"] : (p <= md - 0.01 + 1e-9 ? ["в рынке", "ok"] : ["вне рынка", "neg"]);
  return `<span class="chip ${st[1]}">${st[0]}</span><span class="chip">лучший ${fmtEur(b)} · медиана ${fmtEur(md)}</span>`;
}

function renderList() {
  const q = state.q.trim().toLowerCase();
  const list = [...regions.values()]
    .filter(g => (state.tab === "regional") === g.regional)
    .filter(g => !q || g.ru.toLowerCase().includes(q) || g.name.toLowerCase().includes(q))
    .sort((a, b) => b.qty - a.qty || a.ru.localeCompare(b.ru, "ru"));
  const grid = document.getElementById("grid");
  if (!list.length) { grid.innerHTML = `<div class="empty">Ничего не найдено. Проверьте написание или переключите вкладку.</div>`; }
  else grid.innerHTML = list.map(g => {
    const m = marginOf(g.rows);
    const mini = state.showMargin && m != null ? `<span class="mini chip ${marginClass(m, "10+GB") === "neg" ? "neg" : (m < 0.2 ? "low" : "ok")}">маржа ${pct(m)}${state.showQty ? " · " + fmtInt(g.qty) + " продаж" : ""}</span>`
               : (state.showQty ? `<span class="mini chip">${fmtInt(g.qty)} продаж</span>` : "");
    return `<button class="cty" data-slug="${g.slug}"><span class="flag" aria-hidden="true">${flag(g)}</span><span class="nm">${g.ru}${mini}</span><span class="arr" aria-hidden="true">→</span></button>`;
  }).join("");
  const all = [...regions.values()].filter(g => (state.tab === "regional") === g.regional);
  const rows = all.flatMap(g => g.rows), m = marginOf(rows);
  document.getElementById("sum").textContent = `${list.length} из ${all.length} · маржа по продажам ${m == null ? "—" : pct(m)}`;
  grid.querySelectorAll(".cty").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.slug; }));
}

function rowHtml(r, g, unlimited) {
  const vol = unlimited ? "∞ ГБ" : `${r[I.vol]} ГБ`;
  const days = r[I.validity] === -1 ? "Бессрочно" : `${r[I.validity]} ${r[I.validity] % 10 === 1 && r[I.validity] !== 11 ? "день" : (r[I.validity] < 5 ? "дня" : "дней")}`;
  const info = [state.showMargin ? marginChip(r) : "", state.showComp ? compChip(r) : "",
                state.showQty ? `<span class="chip">${fmtInt(r[I.qty])} продаж</span>` : ""].join("");
  return `<div class="row"><span class="vol">${vol}</span><span class="reg">${g.ru}</span><span class="days">${days}</span>
    <span class="price">${fmtEur(price(r))} EUR</span><span class="info">${info}</span><button class="buy">Купить</button></div>`;
}

function renderCountry(g) {
  const v = document.getElementById("countryView");
  const exp = g.rows.filter(r => r[I.validity] !== -1 && r[I.bucket] !== "Unlimited").sort((a, b) => a[I.validity] - b[I.validity] || a[I.vol] - b[I.vol]);
  const unl = g.rows.filter(r => r[I.bucket] === "Unlimited").sort((a, b) => a[I.validity] - b[I.validity]);
  const nox = g.rows.filter(r => r[I.validity] === -1).sort((a, b) => a[I.vol] - b[I.vol]);
  if (state.plan === "noexp" && !nox.length) state.plan = "exp";
  if (state.plan === "exp" && !exp.length && !unl.length && nox.length) state.plan = "noexp";
  const mExp = marginOf(exp.concat(unl)), mNox = marginOf(nox);
  const qExp = exp.concat(unl).reduce((s, r) => s + (r[I.qty] || 0), 0), qNox = nox.reduce((s, r) => s + (r[I.qty] || 0), 0);
  const stat = (m, q) => state.showMargin ? `<p class="stat">Маржа по продажам: ${m == null ? "нет продаж" : pct(m)}${state.showQty ? ` · ${fmtInt(q)} продаж` : ""}</p>` : "";
  const list = state.plan === "noexp"
    ? (nox.length ? nox.map(r => rowHtml(r, g, false)).join("") : `<div class="empty">Бессрочных тарифов для этого направления нет.</div>`)
    : (unl.length ? `<div class="unl"><p class="lbl">Безлимитные ГБ</p>${unl.map(r => rowHtml(r, g, true)).join("")}</div>${exp.length ? `<p class="more">Больше тарифов</p>` : ""}` : "")
      + exp.map(r => rowHtml(r, g, false)).join("");
  v.innerHTML = `
    <button class="back" id="back">← Все направления</button>
    <div class="ctitle">
      <div class="lead">Доступ к интернету в:</div>
      <h1><span class="flag" aria-hidden="true">${flag(g)}</span>${g.ru.toUpperCase()}</h1>
      <h2>Выберите тарифный план</h2>
      <div class="guar">Гарантия возврата средств за неактивированные eSIM</div>
    </div>
    <div class="plans">
      <button class="plan" data-plan="noexp" aria-pressed="${state.plan === "noexp"}" ${nox.length ? "" : "disabled"}>
        <h3>БЕССРОЧНЫЙ</h3><p>Трафик на балансе не обнуляется — пользуйтесь, пока не закончится.</p>${stat(mNox, qNox)}
      </button>
      <button class="plan" data-plan="exp" aria-pressed="${state.plan === "exp"}">
        <span class="badge">ВЫБОР ПОЛЬЗОВАТЕЛЕЙ</span>
        <h3>КРАТКОСРОЧНЫЙ</h3><p>Пакет трафика доступен в течение определённого периода — по его истечении баланс обнулится.</p>${stat(mExp, qExp)}
      </button>
    </div>
    ${state.showMargin ? `<div class="legend note">Маржа: <span class="chip ok">не ниже цели</span><span class="chip low">ниже цели (30% для 1–10 GB, 20% для остальных)</span><span class="chip neg">ниже себестоимости</span></div>` : ""}
    <div>${list}</div>`;
  v.querySelector("#back").addEventListener("click", () => { location.hash = ""; });
  v.querySelectorAll(".plan").forEach(b => b.addEventListener("click", () => { if (b.disabled) return; state.plan = b.dataset.plan; renderCountry(g); }));
  v.querySelectorAll(".buy").forEach(b => b.addEventListener("click", () => toast("Это макет: покупка не выполняется")));
}

function route() {
  const h = location.hash.replace("#", "");
  const g = [...regions.values()].find(x => x.slug === h);
  document.getElementById("listView").hidden = !!g;
  document.getElementById("countryView").hidden = !g;
  if (g) { renderCountry(g); window.scrollTo(0, 0); } else renderList();
}

let tt;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1800); }

function setTab(tab) {
  state.tab = tab;
  document.getElementById("tabLocal").setAttribute("aria-selected", tab === "local");
  document.getElementById("tabRegional").setAttribute("aria-selected", tab === "regional");
  renderList();
}

// --- load another xlsx with the same columns
function norm(s) { return String(s || "").toLowerCase().replace(/\s+/g, " ").trim(); }
function loadWorkbook(buf) {
  const wb = XLSX.read(buf, {type: "array"});
  const ws = wb.Sheets["ALL_PRICES_REDUCED"] || wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {defval: null});
  if (!rows.length) throw new Error("лист пуст");
  const keys = Object.keys(rows[0]); const col = name => keys.find(k => norm(k) === norm(name));
  const need = ["REGION NAME", "Market", "Subregion", "VOLUME", "VALIDITY DAYS", "GB_bucket", "Base cost, eur", "QTY", "Recommended price, euro"];
  const missing = need.filter(n => !col(n));
  if (missing.length) throw new Error("нет колонок: " + missing.join(", "));
  const num = v => (v === null || v === "" || isNaN(+v)) ? null : Math.round(+v * 100) / 100;
  DATA = rows.filter(r => r[col("REGION NAME")]).map(r => {
    const sku = r[col("SKU")] || null;
    return [r[col("REGION NAME")], sku ? String(sku).split("-")[0] : "", r[col("Market")],
      ["Regional Packages", "Global Packages"].includes(r[col("Subregion")]) ? 1 : 0,
      num(r[col("VOLUME")]), +r[col("VALIDITY DAYS")], r[col("GB_bucket")], num(r[col("Base cost, eur")]), +(r[col("QTY")] || 0),
      num(r[col("Recommended price, euro")]),
      col("recommended_price 1") ? num(r[col("recommended_price 1")]) : null,
      col("recommended_price 2") ? num(r[col("recommended_price 2")]) : null,
      col("recommended_price 3") ? num(r[col("recommended_price 3")]) : null,
      col("recommended_price 4") ? num(r[col("recommended_price 4")]) : null,
      col("best_comp (clean)") ? num(r[col("best_comp (clean)")]) : null,
      col("median_comp (clean)") ? num(r[col("median_comp (clean)")]) : null, sku];
  });
  buildRegions(); route();
}

document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const st = document.getElementById("status");
  if (typeof XLSX === "undefined") { st.textContent = "Не удалось загрузить библиотеку чтения xlsx — проверьте интернет"; return; }
  const rd = new FileReader();
  rd.onload = () => { try { loadWorkbook(new Uint8Array(rd.result)); st.textContent = `Загружено: ${f.name}, ${fmtInt(DATA.length)} тарифов`; }
                      catch (err) { st.textContent = "Файл не прочитан: " + err.message; } };
  rd.readAsArrayBuffer(f);
});
document.getElementById("scenario").addEventListener("change", e => { state.priceIdx = +e.target.value; route(); });
["showMargin", "showComp", "showQty"].forEach(id => document.getElementById(id).addEventListener("change", e => { state[id] = e.target.checked; route(); }));
document.getElementById("tabLocal").addEventListener("click", () => setTab("local"));
document.getElementById("tabRegional").addEventListener("click", () => setTab("regional"));
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
window.addEventListener("hashchange", route);

buildRegions();
document.getElementById("status").textContent = `Данные: итоговый xlsx, ${fmtInt(DATA.length)} тарифов`;
route();

</script>
