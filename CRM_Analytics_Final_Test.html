<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM Analytics — Final Test</title><style>
:root{--bg:#f5f6f8;--card:#fff;--text:#20222a;--muted:#6c7280;--accent:#8b2d65;--line:#dfe3e8;--good:#dff4e6;--bad:#fde6e4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:920px;margin:auto;padding:28px 18px 60px}.hero{background:#222331;color:white;padding:28px;border-radius:18px;margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:clamp(25px,4vw,36px)}.hero p{color:#ddd;margin:0}.progress{height:8px;background:#e6e8ec;border-radius:10px;overflow:hidden;margin:18px 0}.fill{height:100%;width:0;background:var(--accent);transition:.2s}.q{background:var(--card);border:1px solid var(--line);padding:18px;border-radius:14px;margin:14px 0}.q h3{margin:0 0 12px;font-size:17px}.section{color:var(--accent);font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.08em}.opts{display:grid;gap:8px}.opt{border:1px solid var(--line);background:#fff;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer}.opt:hover{border-color:var(--accent)}.opt.selected{border-color:var(--accent);background:#f8edf4}.opt.correct{background:var(--good);border-color:#39945a}.opt.incorrect{background:var(--bad);border-color:#c45a50}.explain{margin-top:10px;padding:10px;border-radius:8px;background:#f1f2f5;color:#363945;display:none}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.button{border:0;background:var(--accent);color:#fff;padding:11px 16px;border-radius:10px;font-weight:700;cursor:pointer}.button.secondary{background:#e5e7eb;color:#292c34}.result{display:none;background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px}.small{color:var(--muted);font-size:14px}footer{text-align:center;color:var(--muted);margin-top:24px;font-size:13px}
</style></head><body><div class="wrap"><header class="hero"><h1>CRM Analytics — Final Test</h1><p>Concepts, decisions and interpretation. This test is not about notebook code or syntax.</p><p class="small">20 questions · 1 point each · choose one answer</p></header><div id="quiz"></div><div class="progress"><div class="fill" id="fill"></div></div><div class="controls"><button class="button" id="submit">Check answers</button><button class="button secondary" id="reset">Restart test</button></div><section class="result" id="result"></section><footer>Practice assessment · CRM segmentation, campaign metrics, incrementality and reporting</footer></div>
<script>
const questions=[
['Segmentation','What is the practical purpose of customer segmentation?', ['To send the same message to the entire database','To group customers so communications can be relevant to their needs or behavior','To remove all inactive customers','To increase message volume'],1,'A segment should identify who the customers are, what action is desired, and why the communication is useful to them.'],
['Segmentation','Which three dimensions make up RFM?', ['Reach, frequency, message','Recency, frequency, monetary value','Retention, funnel, margin','Revenue, feedback, media'],1,'RFM means Recency (time since purchase), Frequency (number of purchases), and Monetary (spend).'],
['Segmentation','A client bought often, but their last purchase was a long time ago. What is the likely CRM concern?', ['They are necessarily a Champion','They may be At Risk and need a carefully tested reactivation','They should receive every discount','They should be deleted from the database'],1,'High frequency with low recency can indicate a formerly valuable customer at risk of churn.'],
['Segmentation','Why might fixed thresholds be better than quantiles for Frequency?', ['SQL cannot calculate quantiles','Many customers have very few purchases, making frequency quantiles unstable or arbitrary','Frequency should be ignored','Fixed thresholds always give equal-sized segments'],1,'The lecture recommends fixed purchase-count thresholds for F, e.g. 1, 2–3, 4+.'],
['Segmentation','Which is a useful communication for a recent first-time purchaser?', ['Welcome/onboarding and help toward a second purchase','An expensive win-back SMS','A message saying they are inactive','A loyalty reward for ten purchases'],0,'New customers are a natural target for onboarding and second-purchase encouragement.'],
['Segmentation','Which customer should usually be excluded from a marketing email send?', ['A customer who has unsubscribed from email','A customer who has not opened recently','A customer who purchased in the past','A customer with low frequency who is in a test segment'],0,'Unsubscribes, missing consent, channel-ineligible contacts, recent sends under frequency caps and duplicates are exclusion candidates.'],
['Campaign Metrics','Delivery rate is calculated as:', ['Delivered ÷ sent','Opened ÷ sent','Clicked ÷ opened','Converted ÷ clicked'],0,'Delivery rate measures delivered messages as a share of sends.'],
['Campaign Metrics','Email Open Rate is normally:', ['Clicks ÷ delivered','Opens ÷ delivered','Conversions ÷ sent','Unsubscribes ÷ opens'],1,'Open rate uses delivered as its denominator.'],
['Campaign Metrics','CTR and CTOR differ because:', ['CTR is clicks/delivered; CTOR is clicks/opens','CTR is opens/clicks; CTOR is delivered/opens','They are always identical','CTOR is only an SMS metric'],0,'CTR measures click-through across delivered; CTOR relates clicks to opens.'],
['Campaign Metrics','Why are email opens less reliable as an interest signal?', ['Email clients may preload content for privacy, inflating recorded opens','Open rate is not stored','All users block images','Opens cannot be counted at all'],0,'Privacy features such as Apple Mail Privacy Protection can trigger opens independent of a human reading.'],
['Campaign Metrics','Which channel does not have a conventional measurable open rate in this framework?', ['Email','SMS','Email and push','All channels'],1,'SMS read status is not available in the same way; use delivery, link clicks, codes and conversion.'],
['Campaign Metrics','Why should the attribution window be set before a campaign?', ['To maximize conversion after seeing results','To prevent outcome-driven window changes and keep comparisons fair','It eliminates the need for a control group','To count only same-day purchases'],1,'Predefining the attribution window avoids changing the rule to fit observed results.'],
['Campaign Metrics','A customer clicked a link five times. For unique CTR analysis, what is usually the appropriate unit?', ['Five clicks necessarily means five customers','Unique clickers, not total click events','Only opens','Only orders'],1,'Unique clicks count distinct people; click-event totals can count repeated activity.'],
['Incrementality','Why is conversion among message recipients not necessarily campaign effect?', ['All recipients are randomly selected','Some recipients would have purchased anyway','Conversion cannot be measured','The control group always buys more'],1,'The campaign effect is incremental conversion relative to a comparable no-message control.'],
['Incrementality','What is a holdout/control group?', ['Customers who receive the strongest offer','A randomly assigned group that does not receive the campaign','Customers who unsubscribe','A list of staff accounts'],1,'The holdout estimates what would have happened without the communication.'],
['Incrementality','Uplift is:', ['Test conversion minus control conversion','Test conversion divided by campaign cost','All purchases after send','Delivery rate minus open rate'],0,'Uplift is the difference in conversion rates, typically reported in percentage points.'],
['Incrementality','If test conversion is 4.0% and control is 3.4%, uplift equals:', ['0.6% relative, exactly','0.6 percentage points','6 percentage points','3.4 percentage points'],1,'4.0% − 3.4% = 0.6 percentage points. Relative uplift would be a different calculation.'],
['Incrementality','A p-value of 0.30 in a test usually means:', ['The campaign is proven successful','There is insufficient evidence to reject equal conversion rates at a 5% threshold','30% of recipients purchased','The effect is exactly zero'],1,'A large p-value does not prove no effect; the observed difference may be compatible with chance.'],
['Incrementality','Why be cautious after testing many segments and finding one p=0.04?', ['Multiple comparisons can produce false positives by chance','That proves all segments respond','Segment sizes are irrelevant','The result should be automatically applied to everyone'],0,'Many separate tests increase the chance of finding a nominally significant result by chance.'],
['Reporting','What should the first line of a campaign report communicate?', ['Open rate and creative preview','Incremental business effect and financial outcome, if estimated','The analyst’s code','Number of chart colors'],1,'A decision-focused report leads with uplift, incremental orders/margin and profitability, then diagnostic channel metrics.']
];
const quiz=document.getElementById('quiz');let chosen={};function render(){quiz.innerHTML='';questions.forEach((q,i)=>{let card=document.createElement('article');card.className='q';card.innerHTML=`<div class="section">${q[0]} · Question ${i+1}</div><h3>${q[1]}</h3><div class="opts">${q[2].map((o,j)=>`<button class="opt ${chosen[i]===j?'selected':''}" data-q="${i}" data-a="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div class="explain" id="exp${i}">${q[4]}</div>`;quiz.appendChild(card)});document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{chosen[b.dataset.q]=+b.dataset.a;render();document.getElementById('fill').style.width=(Object.keys(chosen).length/questions.length*100)+'%';document.getElementById('result').style.display='none'});}
render();document.getElementById('submit').onclick=()=>{let score=0;questions.forEach((q,i)=>{const buttons=document.querySelectorAll(`[data-q="${i}"]`);buttons.forEach((b,j)=>{b.disabled=true;if(j===q[3])b.classList.add('correct');if(chosen[i]===j&&j!==q[3])b.classList.add('incorrect')});if(chosen[i]===q[3])score++;document.getElementById('exp'+i).style.display='block'});let r=document.getElementById('result');r.style.display='block';let percent=Math.round(score/questions.length*100);let grade=percent>=85?'Excellent — strong conceptual understanding.':percent>=70?'Good — review the missed explanations.':percent>=50?'Developing — revisit the key concepts.':'Needs revision — review segmentation, metrics and incrementality.';r.innerHTML=`<h2>Result: ${score} / ${questions.length} (${percent}%)</h2><p>${grade}</p><p class="small">Review the highlighted answers and explanations below. You can restart to take the test again.</p>`;r.scrollIntoView({behavior:'smooth'});};document.getElementById('reset').onclick=()=>{chosen={};document.getElementById('result').style.display='none';document.getElementById('fill').style.width='0';render();window.scrollTo({top:0,behavior:'smooth'})};
</script></body></html>
